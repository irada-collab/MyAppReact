# Fichier Docker Compose du TP4 (application MERN)
services:

  # Base de données MongoDB
  mongodb:
    image: mongo
    container_name: mongodb
    networks:
      - mern-network

  # Serveur Express (API)
  server:
    build: ./server
    container_name: server
    ports:
      - "9000:9000"
    networks:
      - mern-network
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mern

  # Client React
  client:
    build: ./client
    container_name: client
    ports:
      - "3000:3000"
    networks:
      - mern-network
    depends_on:
      - server

# Réseau partagé entre les services
networks:
  mern-network:
    driver: bridge